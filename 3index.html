<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4361ee"><title>五年級數學互動學習天地</title><style>
:root{--blue:#4361ee;--deep:#1d2a52;--mint:#17a87f;--orange:#f59e0b;--bg:#f4f7ff;--border:#dce5f5}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--deep);line-height:1.6}header{background:linear-gradient(125deg,#4361ee,#7957d5);color:white;padding:32px 20px;text-align:center}header h1{margin:0;font-size:clamp(26px,5vw,40px)}header p{margin:8px 0 0}.shell{max-width:1080px;margin:auto;padding:22px 16px 70px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card,.panel{background:white;border:1px solid var(--border);border-radius:19px;box-shadow:0 6px 22px #243b7010}.card{padding:22px;display:flex;flex-direction:column;align-items:flex-start;gap:10px}.card h2{margin:0;font-size:21px}.card p{margin:0;flex:1}.icon{font-size:40px}.pill{border-radius:100px;background:#e8f8f0;color:#157653;font-weight:750;padding:4px 12px;font-size:13px}.pill.lock{background:#fff1d5;color:#9b5d00}button,input{font:inherit}button{border:0;border-radius:13px;background:var(--blue);color:white;padding:12px 18px;font-weight:750;cursor:pointer;min-height:46px;touch-action:manipulation}button:hover{filter:brightness(.97)}button:focus-visible,input:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}.secondary{background:#eaf0ff;color:#2842ae}.green{background:var(--mint)}.ghost{background:#f4f6fa;color:#344663}.panel{padding:clamp(16px,3vw,28px);margin:18px 0}.panel h2,.panel h3{margin-top:0}.section-title{margin:26px 0 10px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:#e8edff;color:#3346a0}.tabs button.active{background:var(--blue);color:white}.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.75fr);gap:18px;align-items:center}.figure{background:#f8fbff;border:2px dashed #ccdaf2;border-radius:14px;min-height:260px;width:100%;touch-action:manipulation}.hint{background:#eef6ff;border-left:5px solid var(--blue);padding:12px 16px;border-radius:9px}.success{color:#08774a;font-weight:800}.error{color:#b44720;font-weight:800}.formula{background:#eaf8f2;border-radius:12px;padding:12px 16px;font-weight:800;font-size:20px;color:#096e52}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.choices button{background:#f0f3ff;color:#243f87;text-align:left;border:2px solid #dbe4ff}.choices button.chosen{border-color:var(--blue);background:#dce6ff}.choices button.correct{border-color:#12a879;background:#def8eb;color:#086342}.choices button.wrong{border-color:#e88473;background:#ffe8e5;color:#943b30}label{font-weight:700}input[type=text],input[type=password],input[type=number]{min-height:46px;width:100%;max-width:300px;border:2px solid #cad5e9;border-radius:12px;padding:10px 14px;background:white}input[type=range]{width:100%;accent-color:var(--blue)}.small{font-size:14px;color:#59667c}.hide{display:none!important}.progress{background:#e9eef8;border-radius:50px;height:11px;overflow:hidden}.progress span{display:block;height:100%;background:#28b589;transition:width .2s}.diagram-note{font-size:15px;color:#50627c}footer{text-align:center;margin-top:34px;color:#62708c;font-size:13px}.divider{height:1px;background:var(--border);margin:18px 0}@media(max-width:700px){.stage{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.shell{padding:14px 12px 45px}header{padding:25px 15px}}
</style></head><body><header><h1>🏫 五年級數學互動學習天地</h1><p>圖形面積探險之旅 · 學概念 → 動手玩 → 挑戰自己</p></header><main class="shell"><div id="home"><div class="panel"><h2>👋 歡迎，小小數學探險家！</h2><p>依照老師的教學進度挑戰四大關卡。每個單元都有清晰圖解、動手探索和即時批改。答錯不要緊，試多一次就會進步！</p><p class="small">🔒 未開放的單元，請在老師公布密碼後再解鎖。</p></div><div class="cards" id="unitCards"></div><div class="panel"><h3>💡 溫習小秘訣</h3><p>先找清楚「底」和「對應的高」，再選擇正確公式。面積的單位要用 <strong>平方厘米（cm²）</strong> 等平方單位。</p></div></div><div id="study" class="hide"><div class="row"><button class="secondary" onclick="goHome()">← 返回單元首頁</button><span id="unitBadge" class="pill"></span></div><h2 id="unitTitle" class="section-title"></h2><div id="unitTabs" class="tabs"></div><div id="lesson"></div></div><footer>專為五年級數學溫習設計 · 支援 iPad 及電腦 · 學習進度僅儲存在此裝置</footer></main>
<script>
// ===== 教師設定區：可在這裏修改單元解鎖密碼 =====
const PASSWORDS={2:'triangle25',3:'trapezium25',4:'challenge25'};
// 提醒：此為公開靜態網頁，密碼只能作為課堂進度門檻，不能用來保護秘密。
const units=[null,{icon:'▱',name:'平行四邊形的面積',desc:'認識底和高、剪拼圖形、學習面積公式。'},{icon:'🔺',name:'三角形的面積',desc:'辨認不同三角形的高，探索「除以 2」的原因。'},{icon:'🔷',name:'梯形的面積',desc:'認識上底、下底和高，探索梯形面積公式。'},{icon:'🧩',name:'組合圖形的面積',desc:'利用分割與拼合，計算多邊形的面積。'}];
const svgStart='<svg class="figure" viewBox="0 0 420 270" role="img" aria-label="數學圖形示範">',svgEnd='</svg>';
const line=(x1,y1,x2,y2,color='#f08b35',dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="4" ${dash?'stroke-dasharray="7 6"':''} stroke-linecap="round"/>`;
const text=(x,y,t,c='#293b70',size=18)=>`<text x="${x}" y="${y}" fill="${c}" font-weight="700" font-size="${size}" text-anchor="middle">${t}</text>`;
let current=1,tab=0,turn=0,correct=0,lockedAnswer=false,drawIndex=0,quizList=[],quizIndex=0,quizScore=0;
function unlocked(id){return id===1||localStorage.getItem('matharea_unlock_'+id)==='yes'}
function goHome(){document.getElementById('study').classList.add('hide');document.getElementById('home').classList.remove('hide');renderHome();scrollTo(0,0)}
function renderHome(){document.getElementById('unitCards').innerHTML=units.slice(1).map((u,i)=>{let id=i+1,open=unlocked(id);return `<article class="card"><div class="icon">${u.icon}</div><span class="pill ${open?'':'lock'}">${open?'✅ 已開放':'🔒 等待老師解鎖'}</span><h2>第${'一二三四'[i]}單元｜${u.name}</h2><p>${u.desc}</p>${open?`<button onclick="openUnit(${id})">開始學習 →</button>`:`<label for="pass${id}">輸入老師公布的解鎖密碼：</label><input id="pass${id}" type="password" autocomplete="off" placeholder="單元密碼" onkeydown="if(event.key==='Enter')unlock(${id})"><button onclick="unlock(${id})">🔑 解鎖單元</button><div id="passmsg${id}" aria-live="polite"></div>`}</article>`}).join('')}
function unlock(id){let value=document.getElementById('pass'+id).value.trim();if(value===PASSWORDS[id]){localStorage.setItem('matharea_unlock_'+id,'yes');renderHome();openUnit(id)}else document.getElementById('passmsg'+id).innerHTML='<span class="error">密碼未正確，請向老師確認。</span>'}
function openUnit(id){if(!unlocked(id))return;current=id;tab=0;document.getElementById('home').classList.add('hide');document.getElementById('study').classList.remove('hide');document.getElementById('unitTitle').textContent=`${units[id].icon} 第${'一二三四'[id-1]}單元｜${units[id].name}`;document.getElementById('unitBadge').textContent='✅ 已解鎖';showTab(0);scrollTo(0,0)}
function showTab(i){tab=i;let names=['📖 知識學習','🔍 動手探索','🎮 互動遊戲','🏆 單元挑戰'];document.getElementById('unitTabs').innerHTML=names.map((n,k)=>`<button class="${i===k?'active':''}" onclick="showTab(${k})">${n}</button>`).join('');if(i===0)renderNotes();if(i===1)renderExplore();if(i===2)renderGame();if(i===3)startQuiz();}
function figure(id,base=8,height=5,offset=3){const s=30,b=base*s,h=height*s,x=75,y=215;if(id===1)return svgStart+`<polygon points="${x+offset*s},${y-h} ${x+(offset+base)*s},${y-h} ${x+b},${y} ${x},${y}" fill="#c9e5ff" stroke="#4269c5" stroke-width="3"/>`+line(x+offset*s,y-h,x+offset*s,y,'#ef893a',true)+`<path d="M${x+offset*s},${y-14} h14 v14" fill="none" stroke="#ef893a" stroke-width="2"/>`+text(x+b/2,y+25,'底 b')+text(x+offset*s+35,y-h/2,'高 h','#b85c16')+svgEnd;
if(id===2)return svgStart+`<polygon points="90,215 335,215 ${115+offset*13},${215-height*25}" fill="#dcf2df" stroke="#20956c" stroke-width="3"/>`+line(115+offset*13,215-height*25,115+offset*13,215,'#ef893a',true)+text(206,243,'底 b')+text(115+offset*13+27,115,'高 h','#b85c16')+svgEnd;
if(id===3)return svgStart+`<polygon points="70,215 350,215 ${270-offset*8},${215-height*24} ${140+offset*8},${215-height*24}" fill="#ffeac7" stroke="#c4801e" stroke-width="3"/>`+line(140+offset*8,215-height*24,140+offset*8,215,'#e76b44',true)+text(210,244,'下底 b')+text(205,215-height*24-10,'上底 a')+text(140+offset*8-24,160,'高 h','#ae5425')+svgEnd;
return svgStart+`<path d="M85 205 V70 H210 V128 H338 V205 Z" fill="#d9e8ff" stroke="#4564b8" stroke-width="3"/>`+line(210,128,210,205,'#e88132',true)+text(142,142,'A')+text(276,174,'B')+svgEnd}
const notes={1:['平行四邊形：兩組對邊分別平行的四邊形。','底：選定的一條邊（也可選另一組邊作底）。','高：與所選底垂直、連接兩條平行線之間的最短距離。高可以在圖形外面。','面積＝底 × 對應的高。'],2:['三角形有三條邊，每條邊都可以選作底。','高：由底所對的頂點，向底所在的直線畫一條垂線。鈍角三角形部分的高會在圖形外。','兩個全等的三角形可拼成一個平行四邊形。','面積＝底 × 對應的高 ÷ 2。'],3:['梯形：只有一組對邊互相平行的四邊形（按本課本常用定義）。','上底、下底：兩條互相平行的邊；稱呼不影響面積計算。','高：兩條平行底邊之間的垂直距離，不是斜腰。','面積＝（上底＋下底）× 高 ÷ 2。'],4:['組合圖形可以由三角形、平行四邊形、梯形或其他已認識圖形組成。','分割法：畫線把複雜圖形分成簡單圖形，分別求面積再相加。','補形法：先算外面較大的圖形面積，再減去缺少的部分。','每段尺寸都要看清楚，不可把斜邊當作高；最後記得寫平方單位。']};
const formulas=['','S = 底 × 高','S = 底 × 高 ÷ 2','S =（上底＋下底）× 高 ÷ 2','總面積 = 各部分面積相加（或大圖形 − 缺少部分）'];
function renderNotes(){document.getElementById('lesson').innerHTML=`<section class="panel"><h2>📖 必記重點</h2><div class="stage"><div>${figure(current)}</div><div><div class="formula">${formulas[current]}</div><ol>${notes[current].map(n=>`<li>${n}</li>`).join('')}</ol></div></div><p class="hint">👀 特別留意：高和底一定成 <strong>90° 直角</strong>；要選用<strong>對應</strong>的底與高。</p></section><div class="row"><button onclick="showTab(1)">下一站：動手探索 →</button></div>`}
function renderExplore(){if(current===4){document.getElementById('lesson').innerHTML=`<section class="panel"><h2>✂️ 分割，還是補形？</h2><div class="stage">${figure(4)}<div><p>這是一個 L 形圖形。藍色虛線把圖形分為兩個長方形。</p><p>另一種方法：先畫完整的大長方形，再扣除右上角缺少的小長方形。</p><p class="formula">方法一：A 面積＋B 面積<br>方法二：大長方形 − 缺角</p></div></div><div class="hint">試一試：同一個組合圖形，可以有不同正確解法！</div></section>`;return}
let labels={1:['改變傾斜程度','底固定、高固定：傾斜程度不同，面積仍相同。'],2:['改變三角形的高','底不變，高愈大，面積愈大。'],3:['改變梯形的高','上、下底不變，高愈大，面積愈大。']};document.getElementById('lesson').innerHTML=`<section class="panel"><h2>🔍 動動手，觀察變化</h2><div class="stage"><div id="exploreSvg">${figure(current)}</div><div><label for="slider">${labels[current][0]}</label><input id="slider" type="range" min="1" max="6" value="3" oninput="updateExplore()"><p id="exploreNumbers" class="formula"></p><p>${labels[current][1]}</p><p class="small">用手指拖動滑桿，觀察圖形與面積有甚麼變化。</p></div></div></section><div class="row"><button onclick="showTab(2)">下一站：互動遊戲 →</button></div>`;updateExplore()}
function updateExplore(){let v=+document.getElementById('slider').value,h=current===1?5:v+1,off=current===1?v:3;document.getElementById('exploreSvg').innerHTML=figure(current,8,h,off);let area=current===1?8*h:current===2?8*h/2:(4+8)*h/2;document.getElementById('exploreNumbers').innerHTML=`${current===3?'上底 4、下底 8':'底 8'}；高 ${h}<br>面積 = ${area} 平方單位`}
// 判斷「高」：在標示的底線上點出垂足（iPad 只需輕觸）。
const heightPuzzles=[{points:'75,185 305,185 350,76 120,76',foot:[120,185],from:[120,76],axis:'horizontal',name:'平行四邊形'},{points:'85,70 85,228 318,173 318,15',foot:[85,173],from:[318,173],axis:'vertical',name:'平行四邊形'},{points:'90,210 330,210 160,65',foot:[160,210],from:[160,65],axis:'horizontal',name:'銳角三角形'},{points:'95,210 335,210 360,65',foot:[360,210],from:[360,65],axis:'horizontal',name:'鈍角三角形（延長底線）'},{points:'70,210 350,210 285,75 145,75',foot:[145,210],from:[145,75],axis:'horizontal',name:'梯形'}];
function renderGame(){drawIndex=0;turn=0;renderDrawGame()}
function allowedPuzzles(){return current===1?[0,1]:current===2?[2,3]:current===3?[4]:[0,2,3,4]}
function renderDrawGame(){let arr=allowedPuzzles(),index=arr[drawIndex%arr.length],p=heightPuzzles[index],ext=index===3?line(335,210,402,210,'#9cacc7',true):'';document.getElementById('lesson').innerHTML=`<section class="panel"><h2>🎮 找出高的垂足！</h2><p>第 ${drawIndex+1} / ${arr.length} 題：<strong>${p.name}</strong></p><p class="hint">橙色圓點是高的起點。請在<strong>藍色底線</strong>上輕觸「高的終點」（垂足），就會畫出高。</p><div class="stage"><svg id="drawSVG" class="figure" viewBox="0 0 420 270" style="touch-action:manipulation" onclick="tapHeight(event)"><polygon points="${p.points}" fill="#d9e8ff" stroke="#4066b7" stroke-width="3"/>${index===1?line(85,70,85,228,'#3264db'):line(index===4?70:index===3?95:index===2?90:75,index===4||index===3||index===2?210:185,index===4?350:index===3?335:index===2?330:305,index===4||index===3||index===2?210:185,'#3264db')}${ext}<circle cx="${p.from[0]}" cy="${p.from[1]}" r="8" fill="#ef812c" stroke="white" stroke-width="2"/><g id="drawResult"></g></svg><div><p class="formula">${p.axis==='vertical'?'這題的底是直立的，高要畫成橫線。':'這題的底是橫向的，高要畫成直線。'}</p><div id="drawMsg" aria-live="polite" class="hint">請點擊圖中的正確位置。</div><p class="small">提示：如果高落在圖形外，記得沿底的直線延長！</p><div class="row"><button class="secondary" onclick="revealHeight()">💡 顯示答案</button><button id="nextDraw" onclick="nextHeight()" class="hide">下一題 →</button></div></div></div></section>`;lockedAnswer=false}
function tapHeight(e){if(lockedAnswer)return;let svg=e.currentTarget,p=heightPuzzles[allowedPuzzles()[drawIndex]],pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let pos=pt.matrixTransform(svg.getScreenCTM().inverse());let hit=Math.hypot(pos.x-p.foot[0],pos.y-p.foot[1])<27;if(hit){showDrawResult('✅ 很好！你找到了正確的垂足。',true)}else{document.getElementById('drawMsg').innerHTML='<span class="error">再試試：高要與底成 90°，想想應該落在哪一點？</span>'}}
function showDrawResult(msg,yes){let p=heightPuzzles[allowedPuzzles()[drawIndex]];document.getElementById('drawResult').innerHTML=line(...p.from,...p.foot,'#f18b2a',true)+`<circle cx="${p.foot[0]}" cy="${p.foot[1]}" r="8" fill="#17a87f"/>`+text(p.foot[0]+18,p.foot[1]-15,'90°','#087c62',17);document.getElementById('drawMsg').innerHTML=`<span class="${yes?'success':'error'}">${msg}</span>`;document.getElementById('nextDraw').classList.remove('hide');lockedAnswer=true}
function revealHeight(){if(!lockedAnswer)showDrawResult('這是答案。下題再試試自己找！',false)}
function nextHeight(){drawIndex++;if(drawIndex>=allowedPuzzles().length){document.getElementById('lesson').innerHTML=`<section class="panel"><h2>🌟 畫高練習完成！</h2><p>你已經看過不同方向的底和高。繼續挑戰面積計算吧！</p><button onclick="showTab(3)">開始單元挑戰 →</button><button class="secondary" onclick="renderGame()">再玩一次</button></section>`}else renderDrawGame()}
function questions(id){if(id===1)return [{q:'平行四邊形底 8 cm，高 5 cm，面積是多少？',a:['13 cm²','40 cm²','20 cm²','80 cm²'],c:1,why:'底 × 高＝8 × 5＝40 cm²。'},{q:'面積 42 cm²，底 7 cm，高是多少？',a:['6 cm','35 cm','49 cm','294 cm'],c:0,why:'高＝面積 ÷ 底＝42 ÷ 7＝6 cm。'},{q:'平行四邊形的高必須與甚麼互相垂直？',a:['斜邊','選定的底','對角線','所有邊'],c:1,why:'高必須與所選定的底成 90°。'},{q:'底 9 cm、高 4 cm，面積是？',a:['18 cm²','36 cm²','26 cm²','13 cm²'],c:1,why:'9 × 4＝36 cm²。'},{q:'面積應用哪一個單位？',a:['cm','cm²','kg','L'],c:1,why:'面積單位要有平方，例如 cm²。'}];if(id===2)return [{q:'三角形底 10 cm、高 6 cm，面積是多少？',a:['60 cm²','16 cm²','30 cm²','32 cm²'],c:2,why:'10 × 6 ÷ 2＝30 cm²。'},{q:'為甚麼三角形的面積公式要「÷ 2」？',a:['因為有 2 條邊','兩個全等三角形可拼成平行四邊形','因為高只有一半','因為有 2 個角'],c:1,why:'兩個全等三角形可拼成面積是兩倍的平行四邊形。'},{q:'三角形面積 24 cm²、底 8 cm，高是多少？',a:['3 cm','6 cm','16 cm','12 cm'],c:1,why:'高＝24 × 2 ÷ 8＝6 cm。'},{q:'鈍角三角形的高可能在哪裏？',a:['只能在裏面','可以在三角形外面','一定是斜邊','沒有高'],c:1,why:'從頂點向底所在直線作垂線，有時要延長底邊。'},{q:'底 7 cm、高 4 cm，三角形面積為？',a:['28 cm²','11 cm²','14 cm²','7 cm²'],c:2,why:'7 × 4 ÷ 2＝14 cm²。'}];if(id===3)return [{q:'梯形上底 4 cm、下底 8 cm、高 5 cm，面積為？',a:['60 cm²','30 cm²','20 cm²','17 cm²'],c:1,why:'（4＋8）×5÷2＝30 cm²。'},{q:'梯形的高是甚麼？',a:['斜腰的長度','兩條平行底邊的垂直距離','上底＋下底','最長的一條邊'],c:1,why:'高是兩條平行線之間的垂直距離。'},{q:'上底 6、下底 10、高 4，面積是多少？',a:['64','32','40','20'],c:1,why:'（6＋10）×4÷2＝32。'},{q:'梯形面積 36 cm²，上下底之和為 12 cm，高是多少？',a:['3 cm','6 cm','12 cm','24 cm'],c:1,why:'36×2÷12＝6 cm。'},{q:'以下哪個公式正確？',a:['上底×下底×高','（上底＋下底）×高÷2','上底＋下底÷2','上底×高÷2'],c:1,why:'兩底之和乘以高，再除以 2。'}];return [{q:'把組合圖形分成兩個不重疊部分，總面積應怎樣算？',a:['兩部分相加','兩部分相乘','隨便選較大的','兩部分相除'],c:0,why:'各部分不重疊，總面積等於面積相加。'},{q:'大長方形面積 60 cm²，挖去三角形面積 12 cm²，剩餘面積是多少？',a:['72 cm²','48 cm²','30 cm²','5 cm²'],c:1,why:'60－12＝48 cm²。'},{q:'平行四邊形面積 24 cm²，旁邊拼上一個三角形（底 6、高 4），總面積是？',a:['48 cm²','36 cm²','30 cm²','60 cm²'],c:1,why:'三角形 6×4÷2＝12，合共 24＋12＝36 cm²。'},{q:'梯形（上底 4、下底 8、高 5）和面積 10 cm² 的三角形拼在一起，總面積為？',a:['40 cm²','30 cm²','50 cm²','70 cm²'],c:0,why:'梯形（4＋8）×5÷2＝30，再加 10＝40 cm²。'},{q:'計算複雜圖形面積，第一步通常是？',a:['亂猜一個數','找方法分割或補成已認識圖形','把所有邊長相加','只量最長的斜邊'],c:1,why:'先看清圖形結構，選擇分割或補形策略。'}]}
function startQuiz(){quizList=questions(current);quizIndex=0;quizScore=0;showQuestion()}
function showQuestion(){if(quizIndex>=quizList.length){document.getElementById('lesson').innerHTML=`<section class="panel" style="text-align:center"><div style="font-size:58px">${quizScore>=4?'🏆':'🌟'}</div><h2>挑戰完成！</h2><p class="formula">你的成績：${quizScore} / ${quizList.length} 題</p><p>${quizScore===5?'非常棒！你已掌握這一單元！':'做得好！可以查看重點筆記，再挑戰一次。'}</p><div class="row" style="justify-content:center"><button onclick="startQuiz()">再挑戰一次</button><button class="secondary" onclick="showTab(0)">回看知識筆記</button></div></section>`;return}let item=quizList[quizIndex];document.getElementById('lesson').innerHTML=`<section class="panel"><div class="row"><h2 style="margin:0">🏆 單元挑戰</h2><span class="pill">第 ${quizIndex+1} / ${quizList.length} 題</span></div><div class="progress"><span style="width:${quizIndex/quizList.length*100}%"></span></div><h3 style="margin-top:20px">${item.q}</h3><div class="choices">${item.a.map((a,i)=>`<button id="choice${i}" onclick="choose(${i})">${'ABCD'[i]}. ${a}</button>`).join('')}</div><div id="answerNotice" aria-live="polite"></div><button id="nextQ" class="hide" onclick="quizIndex++;showQuestion()">${quizIndex===quizList.length-1?'查看成績':'下一題 →'}</button></section>`;lockedAnswer=false}
function choose(i){if(lockedAnswer)return;lockedAnswer=true;let q=quizList[quizIndex];if(i===q.c)quizScore++;q.a.forEach((_,j)=>{let b=document.getElementById('choice'+j);b.disabled=true;if(j===q.c)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('answerNotice').innerHTML=`<p class="${i===q.c?'success':'error'}">${i===q.c?'✅ 答對了！':'💡 再留意公式。正確答案已用綠色標示。'}</p><p class="hint">${q.why}</p>`;document.getElementById('nextQ').classList.remove('hide')}
renderHome();
</script></body></html>
